<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>R2 Control</title>
<style>
  :root { --bg:#0e1116; --panel:#171b22; --line:#2a313c; --text:#e6e9ee; --dim:#8a93a2; --accent:#3b82f6; --stop:#dc2626; --ok:#16a34a; --warn:#d97706; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:12px 16px 32px; }
  h1 { font-size:18px; margin:4px 0 12px; display:flex; justify-content:space-between; align-items:center; }
  .pill { font-size:12px; padding:2px 8px; border-radius:999px; background:var(--line); color:var(--dim); }
  .pill.ok { background:var(--ok); color:#fff; } .pill.bad { background:var(--stop); color:#fff; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 8px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat b { display:block; font-size:18px; } .stat span { color:var(--dim); font-size:12px; }
  #stop { width:100%; padding:18px; font-size:20px; font-weight:700; border:0; border-radius:12px; background:var(--stop); color:#fff; margin-bottom:12px; }
  #pad { position:relative; width:min(78vw,280px); aspect-ratio:1; margin:4px auto 8px; border-radius:50%; background:radial-gradient(circle,#1f2630 0,#141922 70%); border:1px solid var(--line); touch-action:none; }
  #knob { position:absolute; width:64px; height:64px; margin:-32px 0 0 -32px; left:50%; top:50%; border-radius:50%; background:var(--accent); box-shadow:0 2px 10px #0008; pointer-events:none; }
  .row { display:flex; align-items:center; gap:10px; } .row label { min-width:72px; color:var(--dim); } .row input[type=range] { flex:1; } .row output { min-width:36px; text-align:right; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  button.act { padding:12px 6px; border:1px solid var(--line); border-radius:10px; background:#1d232c; color:var(--text); font-size:14px; }
  button.act:active, #stop:active { filter:brightness(1.3); }
  input[type=password] { flex:1; padding:8px; border-radius:8px; border:1px solid var(--line); background:#0b0e12; color:var(--text); }
  #msg { color:var(--dim); font-size:13px; min-height:1.4em; margin-top:6px; }
  details summary { cursor:pointer; color:var(--dim); }
  #cam { display:none; width:100%; border-radius:8px; background:#000; margin-top:8px; }
  #camBtn { width:100%; }
  select, input[type=text] { flex:1; padding:8px; border-radius:8px; border:1px solid var(--line); background:#0b0e12; color:var(--text); min-width:0; }
  .hint { color:var(--dim); font-size:13px; margin:6px 0; }
  .stack > * { margin-top:8px; }
  .switches { display:grid; gap:10px; margin-top:12px; }
  .sw { display:flex; align-items:center; gap:10px; cursor:pointer; }
  .sw input { position:absolute; opacity:0; width:1px; height:1px; }
  .sw span { position:relative; flex:none; width:44px; height:26px; border-radius:999px; background:var(--line); transition:background .15s; }
  .sw span::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .15s; }
  .sw input:checked + span { background:var(--accent); }
  .sw input:checked + span::after { transform:translateX(18px); }
  .sw input:focus-visible + span { outline:2px solid var(--accent); outline-offset:2px; }
  .sw input:disabled + span { opacity:.5; }
  .stat.wide { grid-column:span 2; }
  .battery { position:relative; height:28px; margin-right:6px; border:2px solid var(--dim); border-radius:6px; overflow:visible; display:flex; align-items:center; justify-content:center; }
  .battery::after { content:""; position:absolute; right:-6px; top:8px; width:4px; height:8px; border-radius:0 2px 2px 0; background:var(--dim); }
  .battery .fill { position:absolute; left:2px; top:2px; bottom:2px; width:0; border-radius:3px; background:var(--ok); transition:width .4s, background .4s; }
  .battery .fill.mid { background:var(--warn); } .battery .fill.low { background:var(--stop); }
  .battery b { position:relative; font-size:14px; text-shadow:0 1px 2px #000a; }
  .battery .bolt { position:relative; display:none; width:16px; height:16px; margin-right:2px; fill:#fde047; filter:drop-shadow(0 1px 1px #000a); }
  .battery.charging .bolt { display:block; }
  .led { display:block; width:18px; height:18px; margin:5px 0; border-radius:50%; background:#333a45; transition:background .2s, box-shadow .2s; }
  .led.on { background:var(--warn); box-shadow:0 0 10px var(--warn); }
  #headPad { position:relative; flex:1; height:44px; border-radius:22px; background:#141922; border:1px solid var(--line); touch-action:none; }
  #headKnob { position:absolute; top:50%; left:50%; width:40px; height:40px; margin:-20px 0 0 -20px; border-radius:50%; background:var(--accent); box-shadow:0 2px 8px #0008; pointer-events:none; }
  #headPad::before, #headPad::after { position:absolute; top:50%; transform:translateY(-50%); color:var(--dim); font-size:13px; }
  #headPad::before { content:"◀"; left:12px; } #headPad::after { content:"▶"; right:12px; }
  #headCenter { padding:8px 10px; }
  .presets { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:12px; }
  .presets button { padding:10px 4px; }
  .presets button[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .presets button:disabled { opacity:.5; }
</style>
</head>
<body>
<main>
  <h1>R2 Control <span id="conn" class="pill">not connected</span></h1>

  <button id="stop">STOP</button>

  <section>
    <h2>Status</h2>
    <div class="stats">
      <div class="stat wide">
        <div class="battery" id="battBar" role="img" aria-label="battery unknown">
          <div class="fill" id="battFill"></div>
          <svg class="bolt" id="bolt" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
          <b id="batt">–</b>
        </div>
        <span id="chg">battery</span>
      </div>
      <div class="stat"><i class="led" id="mov"></i><span>moving</span></div>
    </div>
  </section>

  <section>
    <h2>Camera</h2>
    <button class="act" id="camBtn">Show camera</button>
    <img id="cam" alt="R2's camera">
  </section>

  <section>
    <h2>Drive</h2>
    <div id="pad"><div id="knob"></div></div>
    <div class="row"><label for="power">Max power</label><input id="power" type="range" min="10" max="100" value="40"><output id="powerOut">40</output></div>
    <div class="row"><label>Head</label><div id="headPad" aria-label="Head: hold left or right to turn"><div id="headKnob"></div></div><button class="act" id="headCenter">Center</button></div>
  </section>

  <section>
    <h2>Settings</h2>
    <div class="row"><label for="vol">Volume</label><input id="vol" type="range" min="0" max="100" value="30"><output id="volOut">–</output></div>
    <div class="row"><label>Activity</label><span class="hint" id="liveHint">–</span></div>
    <div class="presets" id="presets" role="group" aria-label="Activity preset">
      <button class="act" data-level="off">Off</button>
      <button class="act" data-level="quiet">Quiet</button>
      <button class="act" data-level="chatty">Chatty</button>
      <button class="act" data-level="full">Full show</button>
    </div>
    <div class="switches">
      <label class="sw"><input type="checkbox" id="swSound" data-on="unmute" data-off="mute"><span></span>Sound</label>
      <label class="sw"><input type="checkbox" id="swVoice" data-on="voice-on" data-off="voice-off"><span></span>Voice commands</label>
      <label class="sw"><input type="checkbox" id="swFace" data-on="face-on" data-off="face-off"><span></span>Face tracking</label>
    </div>
  </section>

  <section>
    <h2>Actions</h2>
    <div class="grid" id="actions"></div>
  </section>

  <section>
    <h2>Routines</h2>
    <div class="hint" id="routineNow">–</div>
    <div class="grid" id="routines"></div>
  </section>

  <section>
    <h2>Wi-Fi</h2>
    <div class="hint" id="wifiNow">–</div>
    <div class="hint" id="setupHint"></div>
    <div class="stack">
      <div class="row"><button class="act" id="scan">Scan for networks</button><button class="act" id="getToken" style="display:none">Pair this device</button></div>
      <div class="row"><select id="nets"><option value="">(scan first, or type a name)</option></select></div>
      <div class="row"><input id="ssid" type="text" placeholder="Network name" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <div class="row"><input id="wpw" type="password" placeholder="Wi-Fi password (empty for an open network)" autocomplete="off"><button class="act" id="join">Join</button></div>
      <div class="row"><button class="act" id="hsShow">Show hotspot password</button><button class="act" id="hsNew">New hotspot password</button></div>
      <div class="hint" id="hsNow"></div>
    </div>
  </section>

  <section>
    <details id="setup">
      <summary>Connection</summary>
      <div class="row" style="margin-top:8px"><input id="token" type="password" placeholder="API token" autocomplete="off"><button class="act" id="save">Save</button></div>
    </details>
    <div id="msg"></div>
  </section>
</main>
<script>
const ACTIONS = ["wake","dance","shake-head","who-are-you","noise","turn-left","turn-right","turn-around","forward","circle","patrol","lightsaber","arm","short-lcd","long-lcd","flash-front","flash-back","leia","luke"];
const $ = id => document.getElementById(id);
let token = "";
try { token = localStorage.getItem("r2token") || ""; } catch (e) {}
$("token").value = token;
if (!token) $("setup").open = true;

function say(t) { $("msg").textContent = t; }

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "X-R2-Token": token, "Content-Type": "application/json" }, body });
  const text = await r.text();
  let data; try { data = JSON.parse(text); } catch (e) { data = { result: text }; }
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}
const send = cmd => api("POST", "/serial", JSON.stringify(cmd));

$("save").onclick = () => {
  token = $("token").value.trim();
  try { localStorage.setItem("r2token", token); } catch (e) {}
  $("setup").open = false; refresh(); loadRoutines();
};
$("stop").onclick = () => { driving = false; api("POST", "/stop").then(() => say("stopped"), e => say("stop failed: " + e.message)); };

for (const a of ACTIONS) {
  const b = document.createElement("button");
  b.className = "act"; b.textContent = a.replace(/-/g, " ");
  b.onclick = () => api("POST", "/action?name=" + encodeURIComponent(a)).then(d => say(d.result), e => say(e.message));
  $("actions").appendChild(b);
}

let volTouched = 0; // the controls follow /status, except right after you change them
const SWITCHES = { swSound: s => s.muted == null ? null : !s.muted, swVoice: s => s.voice, swFace: s => s.face_tracking };
for (const id in SWITCHES) {
  $(id).disabled = true; // until R2 reports the setting
  $(id).onchange = e => {
    volTouched = Date.now();
    const name = e.target.checked ? e.target.dataset.on : e.target.dataset.off;
    api("POST", "/action?name=" + name).then(d => say(d.result), err => say(err.message));
  };
}
// Activity presets: one "liveliness" setting for R2's own sounds, head turns and reactions.
const LIVE_HINT = {
  off: "no sounds or moves of his own, only what you ask",
  quiet: "a sound now and then, reacts only to very loud noises",
  chatty: "chatters, looks around and reacts to sounds",
  full: "the full show, and stays awake 10 minutes",
};
function showLiveliness(level) {
  for (const b of $("presets").children) {
    b.disabled = level == null;
    b.setAttribute("aria-pressed", String(b.dataset.level === level));
  }
  $("liveHint").textContent = level == null ? "–" : LIVE_HINT[level] || level;
}
let liveTouched = 0;
for (const b of $("presets").children) {
  b.onclick = () => {
    liveTouched = Date.now();
    showLiveliness(b.dataset.level);
    api("POST", "/action?name=liveliness-" + b.dataset.level).then(d => say(d.result), e => say(e.message));
  };
}
showLiveliness(null); // until R2 reports the setting
// Stored routines (docs/routines.md), one button each. Upload them with tools\r2.ps1 routine-put <file>.
async function loadRoutines() {
  if (!token) return;
  try {
    const d = await api("GET", "/routines");
    const box = $("routines"); box.textContent = "";
    for (const r of d.routines || []) {
      const b = document.createElement("button");
      b.className = "act"; b.textContent = r.name.replace(/-/g, " ");
      b.title = r.error ? "broken: " + r.error : (r.description || "");
      b.disabled = !!r.error;
      b.onclick = () => api("POST", "/routine/run?name=" + encodeURIComponent(r.name)).then(x => say(x.result), e => say(e.message));
      box.appendChild(b);
    }
    if (!box.children.length) $("routineNow").textContent = "no routines yet (tools\\r2.ps1 routine-put <file>)";
  } catch (e) {
    $("routineNow").textContent = "routines: " + e.message;
  }
}
async function refresh() {
  if (!token) { $("conn").textContent = "token needed"; return; }
  try {
    const s = await api("GET", "/status");
    $("conn").textContent = "connected"; $("conn").className = "pill ok";
    const g = s.last_gin || {};
    const pct = g.batt, c = g["charging-status"] ?? g.charging_status;
    $("batt").textContent = pct != null ? pct + "%" : "–";
    const fill = $("battFill");
    fill.style.width = pct != null ? "calc(" + Math.max(0, Math.min(100, pct)) + "% - 4px)" : "0";
    fill.className = "fill" + (pct == null ? "" : pct < 20 ? " low" : pct < 50 ? " mid" : "");
    $("battBar").classList.toggle("charging", c === 1);
    $("chg").textContent = c === 1 ? "charging" : c === 2 ? "charged" : "battery";
    $("battBar").setAttribute("aria-label", "battery " + (pct ?? "unknown") + "%" + (c === 1 ? ", charging" : ""));
    $("mov").classList.toggle("on", !!s.moving);
    $("mov").title = s.moving ? "moving" : "still";
    if (s.running != null && $("routines").children.length) {
      $("routineNow").textContent = (s.running === "idle" ? "idle" : "running: " + s.running)
        + (s.last_routine ? " · last: " + s.last_routine : "");
    }
    if (s.liveliness != null && Date.now() - liveTouched > 3000) showLiveliness(s.liveliness);
    if (s.volume != null && Date.now() - volTouched > 3000) {
      $("vol").value = s.volume;
      $("volOut").textContent = s.muted ? "muted" : s.volume + "%";
      for (const id in SWITCHES) {
        const v = SWITCHES[id](s);
        if (v != null) { $(id).checked = v; $(id).disabled = false; }
      }
    }
  } catch (e) {
    $("conn").textContent = e.message.includes("Token") ? "wrong token" : "offline"; $("conn").className = "pill bad";
  }
}
setInterval(refresh, 2000); refresh(); loadRoutines();

// Joystick: angle 0 = forward, 90 = spin right, -90 = spin left, 180 = back (the controller's `move`).
// While held, the command is repeated so the agent's motion watchdog (3 s) keeps it alive.
const pad = $("pad"), knob = $("knob");
let driving = false, want = { power: 0, angle: 0 }, loopOn = false;
$("power").oninput = e => $("powerOut").textContent = e.target.value;

function setFromPointer(ev) {
  const r = pad.getBoundingClientRect(), R = r.width / 2;
  let dx = ev.clientX - r.left - R, dy = ev.clientY - r.top - R;
  const d = Math.min(Math.hypot(dx, dy), R);
  const a = Math.atan2(dx, -dy);
  knob.style.left = (R + Math.sin(a) * d) / r.width * 100 + "%";
  knob.style.top = (R - Math.cos(a) * d) / r.width * 100 + "%";
  const mag = d / R;
  want = mag < 0.15 ? { power: 0, angle: 0 } : { power: Math.round(mag * +$("power").value), angle: Math.round(a * 180 / Math.PI) };
}
async function driveLoop() {
  if (loopOn) return; loopOn = true;
  while (driving) {
    const t = Date.now();
    try { await send({ cmd: "move", power: want.power, angle: want.angle }); } catch (e) { say("drive: " + e.message); }
    await new Promise(r => setTimeout(r, Math.max(0, 250 - (Date.now() - t))));
  }
  loopOn = false;
  send({ cmd: "move", power: 0, angle: 0 }).catch(() => {});
}
pad.addEventListener("pointerdown", e => { pad.setPointerCapture(e.pointerId); driving = true; setFromPointer(e); driveLoop(); });
pad.addEventListener("pointermove", e => { if (driving) setFromPointer(e); });
const release = () => { driving = false; knob.style.left = "50%"; knob.style.top = "50%"; };
pad.addEventListener("pointerup", release); pad.addEventListener("pointercancel", release);

// The camera only runs while this view is open; closing it drops the stream and R2 turns the camera off.
let camOn = false;
function setCam(on) {
  camOn = on;
  cam.style.display = on ? "block" : "none";
  cam.src = on ? "/camera.mjpg?token=" + encodeURIComponent(token) : "";
  if (!on) cam.removeAttribute("src");
  camBtn.textContent = on ? "Hide camera" : "Show camera";
}
camBtn.onclick = () => setCam(!camOn);
cam.onerror = () => { if (camOn) { say("camera unavailable"); setCam(false); } };
document.addEventListener("visibilitychange", () => { if (document.hidden && camOn) setCam(false); });

// Wi-Fi setup. Without a token this works only in the setup window: press R2's pairing button,
// then use this page within 2 minutes (e.g. from R2's own hotspot). "Pair this device" saves R2's token here.
async function setupState() {
  try {
    const s = await (await fetch("/setup")).json();
    setupHint.textContent = s.open
      ? "Setup window open for " + s.seconds_left + " s: Wi-Fi setup works without a token."
      : (token ? "" : "No token yet: press R2's pairing button to open setup for 2 minutes.");
    getToken.style.display = s.open && !token ? "" : "none";
  } catch (e) {}
}
setInterval(setupState, 3000); setupState();

getToken.onclick = async () => {
  try {
    token = (await api("GET", "/setup/token")).token;
    try { localStorage.setItem("r2token", token); } catch (e) {}
    token.value = token; say("this device is paired: token saved"); setupState(); refresh();
  } catch (e) { say("pairing failed: " + e.message); }
};
scan.onclick = async () => {
  say("scanning...");
  try {
    const w = await api("GET", "/wifi/scan");
    wifiNow.textContent = w.ap ? "R2 is running its own hotspot." : (w.current ? "R2 is on " + w.current + "." : "R2 is not on a network.");
    const sel = nets; sel.innerHTML = "";
    const nets = (w.networks || []).sort((a, b) => b.rssi - a.rssi);
    sel.appendChild(new Option(nets.length ? "Choose a network" : "(none seen yet: R2 only scans while it's on Wi-Fi)", ""));
    for (const n of nets) sel.appendChild(new Option(n.ssid + "  (" + n.rssi + " dBm)", n.ssid));
    say(nets.length + " networks");
  } catch (e) { say("scan: " + e.message); }
};
nets.onchange = e => { if (e.target.value) ssid.value = e.target.value; };
join.onclick = async () => {
  const name = ssid.value.trim();
  if (!name) { say("choose or type a network name"); return; }
  try {
    const r = await api("POST", "/wifi/join", JSON.stringify({ ssid: name, password: wpw.value }));
    wpw.value = "";
    say(r.result + " Then find R2 again (tools\\r2.ps1 find, or your router's device list).");
  } catch (e) { say("join: " + e.message); }
};

// R2's own hotspot: its name and this robot's password. Without a token, only in the setup window
// (the pairing button also runs the hotspot with its factory settings for those 2 minutes).
function showHotspot(h) {
  hsNow.textContent = "Hotspot " + h.ssid + ", password " + h.password
    + (h.using === "factory" ? " (factory settings for " + h.factory_seconds_left + " s more)" : "");
}
hsShow.onclick = async () => {
  try { showHotspot(await api("GET", "/hotspot")); } catch (e) { say("hotspot: " + e.message); }
};
hsNew.onclick = async () => {
  if (!confirm("Give R2's hotspot a new random password? Phones on it now have to join again with the new one.")) return;
  try { const h = await api("POST", "/hotspot", "{}"); showHotspot(h); say(h.result); } catch (e) { say("hotspot: " + e.message); }
};

let volTimer;
$("vol").oninput = e => {
  volTouched = Date.now();
  $("volOut").textContent = e.target.value + "%";
  clearTimeout(volTimer);
  volTimer = setTimeout(() => api("POST", "/volume?percent=" + e.target.value).catch(err => say(err.message)), 200);
};

// Head joystick: hold left or right and the head turns that way (the controller's head-dir); let go and it
// stops where it is. While held, the turn is repeated so the agent's head watchdog (1.2 s) keeps it going.
const headPad = $("headPad"), headKnob = $("headKnob");
let headDir = 0, headHeld = false, headLoop = null;
function setHeadDir(d) {
  if (d === headDir) return;
  headDir = d;
  send({ cmd: "head-dir", dir: d }).catch(err => say(err.message));
}
function headAt(e) {
  const r = headPad.getBoundingClientRect(), half = (r.width - 40) / 2;
  const x = Math.max(-half, Math.min(half, e.clientX - r.left - r.width / 2));
  headKnob.style.left = "calc(50% + " + x + "px)";
  const f = x / half;
  setHeadDir(f > 0.25 ? 1 : f < -0.25 ? -1 : 0);
}
function headRelease() {
  if (!headHeld) return;
  headHeld = false;
  clearInterval(headLoop);
  headKnob.style.left = "50%";
  headDir = null; // force the stop to be sent
  setHeadDir(0);
}
headPad.addEventListener("pointerdown", e => {
  headHeld = true;
  headPad.setPointerCapture(e.pointerId);
  headAt(e);
  clearInterval(headLoop);
  headLoop = setInterval(() => { if (headDir) send({ cmd: "head-dir", dir: headDir }).catch(() => {}); }, 400);
});
headPad.addEventListener("pointermove", e => { if (headHeld) headAt(e); });
headPad.addEventListener("pointerup", headRelease);
headPad.addEventListener("pointercancel", headRelease);
$("headCenter").onclick = () => send({ cmd: "head-angle", angle: 0 }).catch(err => say(err.message));
</script>
</body>
</html>

name: R2-D2 update mirror
version: "1.1.0"
slug: r2_update_mirror
description: Downloads R2-D2's signed releases from GitHub and serves them to R2 on your network, so R2 can update itself.
url: https://github.com/Sk3yNet/Fanhome_R2-D2_Custom_Software/blob/main/docs/update-mirror.md
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: Release mirror for R2 (plain HTTP on your network)
# The page in Home Assistant's sidebar; its buttons only work there (signed-in users).
ingress: true
ingress_port: 8765
panel_icon: mdi:robot
panel_title: R2-D2
# MQTT discovery for the update entity and health sensors; notifications after an install.
services:
  - mqtt:want
homeassistant_api: true
options:
  repositories:
    - Sk3yNet/Fanhome_R2-D2_Custom_Software
  check_hours: 6
  prereleases: false
  keep_releases: 2
  trusted_certs: []
  github_token: ""
  robot: ""
  robot_token: ""
  ha_entities: true
  backup_settings: false
  backup_keep: 14
schema:
  repositories:
    - match(^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$)
  check_hours: int(1,168)
  prereleases: bool
  keep_releases: int(1,10)
  trusted_certs:
    - match(^[0-9a-fA-F:]{64,95}$)
  github_token: password?
  robot: match(^[A-Za-z0-9.-]*$)
  robot_token: password?
  ha_entities: bool
  backup_settings: bool
  backup_keep: int(1,60)

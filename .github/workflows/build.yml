name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Off-robot tests of the routine engine and hotspot passwords (downloads Android 4.4's org.json from Maven Central).
      - name: Off-robot tests
        run: apps/test.sh

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.1" "platforms;android-19" > /dev/null

      # --release: no API token in the APKs. The signing key is a throwaway made for this run, so these
      # builds only check that everything compiles and packages; they can't update an installed robot.
      - name: Build both apps
        run: apps/build.sh all --release

      - name: Check the APKs
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.1"
          for apk in apps/out/R2Agent.apk apps/out/R2Main.apk; do
            "$BT/apksigner" verify --min-sdk-version 19 "$apk"
            "$BT/aapt2" dump badging "$apk" | head -1
          done
          unzip -l apps/out/R2Agent.apk | grep -q 'assets/web-index.html'

      # The release workflow's path: a keystore handed in through R2_KEYSTORE, and a version name from a tag.
      # Uses a throwaway key with a different alias, so it can't fall back to the one in secrets/ by accident.
      - name: Build with an outside key, as releases do
        run: |
          export R2_KEYSTORE="$RUNNER_TEMP/test-release.keystore" R2_KEYSTORE_PASS=test-pass-$RANDOM R2_KEY_ALIAS=release
          keytool -genkeypair -keystore "$R2_KEYSTORE" -storepass "$R2_KEYSTORE_PASS" -keypass "$R2_KEYSTORE_PASS" \
            -alias release -keyalg RSA -keysize 2048 -validity 1 -dname CN=ci-test
          R2_VERSION_NAME=0.0.0-ci apps/build.sh main --release
          BT="$ANDROID_HOME/build-tools/35.0.1"
          "$BT/aapt2" dump badging apps/out/R2Main.apk | grep -q "versionName='0.0.0-ci'"
          "$BT/apksigner" verify --print-certs apps/out/R2Main.apk | grep -q 'CN=ci-test'

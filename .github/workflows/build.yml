name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # tools/r2.py, the cross-platform PC tool, against a pretend agent (no robot needed).
  pc-tool:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: '3.8' }   # the oldest Python r2.py supports
          - { os: ubuntu-latest, python: '3.x' }
          - { os: macos-latest, python: '3.x' }
          - { os: windows-latest, python: '3.x' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: PC tool tests
        run: python -m unittest discover -s tools -p "test_*.py" -v

  # The Home Assistant update mirror add-on (docs/update-mirror.md): its tests against a pretend GitHub, then
  # the add-on image as Home Assistant builds it, started with default options to check that it serves.
  ha-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add-on tests
        run: python -m unittest discover -s homeassistant/r2_update_mirror -p "test_*.py" -v
      - name: Add-on image builds and serves
        run: |
          ADDON=homeassistant/r2_update_mirror
          BASE=$(sed -n 's/^  amd64: //p' $ADDON/build.yaml)
          docker build --build-arg BUILD_FROM="$BASE" -t r2-update-mirror $ADDON
          mkdir -p "$RUNNER_TEMP/data"
          echo '{"repositories": ["Sk3yNet/Fanhome_R2-D2_Custom_Software"], "check_hours": 6}' > "$RUNNER_TEMP/data/options.json"
          docker run -d --name mirror -p 8765:8765 -v "$RUNNER_TEMP/data:/data" r2-update-mirror
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8765/status.json && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/ | grep -q 'update-mirror http://127.0.0.1:8765'
          docker logs mirror
          docker rm -f mirror

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Off-robot tests of the routine engine, chirp generator and hotspot passwords (downloads Android 4.4's org.json from Maven Central).
      - name: Off-robot tests
        run: apps/test.sh

      # The example chirps that the tests write (docs/chirps.md), to listen to without the robot.
      - name: Upload example chirps
        uses: actions/upload-artifact@v4
        with:
          name: example-chirps
          path: apps/out/chirps/*.wav
          if-no-files-found: error

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.1" "platforms;android-19" > /dev/null

      # --release: no API token in the APKs. The signing key is a throwaway made for this run, so these
      # builds only check that everything compiles and packages; they can't update an installed robot.
      - name: Build both apps
        run: apps/build.sh all --release

      - name: Check the APKs
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.1"
          for apk in apps/out/R2Agent.apk apps/out/R2Main.apk; do
            "$BT/apksigner" verify --min-sdk-version 19 "$apk"
            "$BT/aapt2" dump badging "$apk" | head -1
          done
          unzip -l apps/out/R2Agent.apk | grep -q 'assets/web-index.html'

      # switch-source reads certificates and versionCodes on the PC with tools/apk-info.ps1: check it gives
      # the same answers as the SDK tools, and that the PowerShell scripts parse.
      - name: PC tools read APKs like the SDK does
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem tools -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | Out-String | Write-Error; exit 1 }
          }
          . ./tools/apk-info.ps1
          $bt = "$env:ANDROID_HOME/build-tools/35.0.1"
          foreach ($apk in 'apps/out/R2Agent.apk', 'apps/out/R2Main.apk') {
            $cert = (& "$bt/apksigner" verify --print-certs $apk | Select-String 'Signer #1 certificate SHA-256 digest: (\w+)').Matches[0].Groups[1].Value
            $code = (& "$bt/aapt2" dump badging $apk | Select-String "versionCode='(\d+)'").Matches[0].Groups[1].Value
            "$apk  cert $cert  versionCode $code"
            if ((Get-ApkCert $apk) -ne $cert) { throw "Get-ApkCert $apk gave $(Get-ApkCert $apk)" }
            if ((Get-ApkVersionCode $apk) -ne [int]$code) { throw "Get-ApkVersionCode $apk gave $(Get-ApkVersionCode $apk)" }
          }

      # The same check for tools/r2.py, which reads APKs the same way for its switch-source.
      - name: r2.py reads APKs like the SDK does
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.1"
          for apk in apps/out/R2Agent.apk apps/out/R2Main.apk; do
            cert=$("$BT/apksigner" verify --print-certs "$apk" | sed -n 's/.*Signer #1 certificate SHA-256 digest: \([0-9a-f]*\).*/\1/p' | head -1)
            code=$("$BT/aapt2" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
            got=$(python3 tools/r2.py apk-info "$apk")
            echo "$apk  sdk: cert $cert  versionCode $code   r2.py: $got"
            [ "$got" = "cert $cert  versionCode $code" ]
          done

      # Updating from a PC (docs/releases.md): both PC tools put the same builds into the update mirror the
      # agent reads, with the same latest.json, and serve it so that the files come back unchanged.
      - name: PC tools fill and serve the update mirror
        run: |
          m=apps/out/mirror/Sk3yNet/Fanhome_R2-D2_Custom_Software
          python3 tools/r2.py update-fetch apps/out --tag ci-1
          cp "$m/latest.json" "$RUNNER_TEMP/py.json"
          pwsh -NoProfile -File tools/r2.ps1 update-fetch apps/out -Tag ci-1
          python3 - "$RUNNER_TEMP/py.json" "$m/latest.json" <<'EOF'
          import json, sys
          py, ps = (json.load(open(f)) for f in sys.argv[1:])
          for x in (py, ps):
              x.pop('published')
          assert py == ps, (py, ps)
          assert set(py['assets']) == {'R2Main.apk', 'R2Agent.apk'}, py
          EOF
          python3 tools/r2.py update-serve 18780 > "$RUNNER_TEMP/py-serve.log" 2>&1 &
          pids=$!
          pwsh -NoProfile -File tools/r2.ps1 update-serve 18781 > "$RUNNER_TEMP/ps-serve.log" 2>&1 &
          pids="$pids $!"
          trap 'kill $pids; cat "$RUNNER_TEMP"/*-serve.log' EXIT
          for port in 18780 18781; do
            base=http://127.0.0.1:$port/Sk3yNet/Fanhome_R2-D2_Custom_Software
            for i in $(seq 30); do curl -sf -o /dev/null "$base/latest.json" && break; sleep 1; done
            curl -sf "$base/latest.json" -o "$RUNNER_TEMP/latest.json"
            for apk in R2Main.apk R2Agent.apk; do
              want=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['assets'][sys.argv[2]]['sha256'])" "$RUNNER_TEMP/latest.json" $apk)
              got=$(curl -sf "$base/ci-1/$apk" | sha256sum | cut -d' ' -f1)
              echo "port $port $apk $got"
              [ "$got" = "$want" ]
            done
            [ "$(curl -s --path-as-is -o /dev/null -w '%{http_code}' "$base/../../../../tools/r2.py")" = 404 ]
          done

      # And for the Home Assistant add-on, which reads them to check the signer before serving a release.
      - name: Update mirror add-on reads APKs like the SDK does
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.1"
          for apk in apps/out/R2Agent.apk apps/out/R2Main.apk; do
            cert=$("$BT/apksigner" verify --print-certs "$apk" | sed -n 's/.*Signer #1 certificate SHA-256 digest: \([0-9a-f]*\).*/\1/p' | head -1)
            code=$("$BT/aapt2" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
            got=$(python3 homeassistant/r2_update_mirror/mirror.py apk-info "$apk")
            echo "$apk  sdk: cert $cert  versionCode $code   add-on: $got"
            [ "$got" = "cert $cert  versionCode $code" ]
          done

      # The release workflow's path: a keystore handed in through R2_KEYSTORE, and a version name from a tag.
      # Uses a throwaway key with a different alias, so it can't fall back to the one in secrets/ by accident.
      - name: Build with an outside key, as releases do
        run: |
          export R2_KEYSTORE="$RUNNER_TEMP/test-release.keystore" R2_KEYSTORE_PASS=test-pass-$RANDOM R2_KEY_ALIAS=release
          keytool -genkeypair -keystore "$R2_KEYSTORE" -storepass "$R2_KEYSTORE_PASS" -keypass "$R2_KEYSTORE_PASS" \
            -alias release -keyalg RSA -keysize 2048 -validity 1 -dname CN=ci-test
          R2_VERSION_NAME=0.0.0-ci apps/build.sh main --release
          BT="$ANDROID_HOME/build-tools/35.0.1"
          "$BT/aapt2" dump badging apps/out/R2Main.apk | grep -q "versionName='0.0.0-ci'"
          "$BT/apksigner" verify --print-certs apps/out/R2Main.apk | grep -q 'CN=ci-test'
